[package]
name = "orderbook"
version = "0.1.0"
description = "Deterministic, allocation-free limit order book with price-time priority."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustc-hash = "2.1.3"

[dev-dependencies]
core_affinity = "0.8.3"
criterion = "0.7.0"
hdrhistogram = { version = "7.5.4", default-features = false }
proptest = "1.11.0"

# `cargo kani` compiles the proof harnesses in `src/` with `--cfg kani`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false
