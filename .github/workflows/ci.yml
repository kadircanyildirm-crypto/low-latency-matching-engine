name: CI

on:
  push:
  pull_request:

# Nothing here writes to the repository: whatever an action or a build script does, the
# token can only read. Actions are pinned to commits, which a moved tag cannot change;
# Dependabot proposes updates (.github/dependabot.yml).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The golden-fingerprint test runs on every OS (and on ARM via macOS), so passing here
  # shows the engine produces identical output across platforms.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo bench --workspace --no-run --locked

  # The ring buffer's unsafe code: under Miri, which detects undefined behaviour, data races
  # included, while the tests run; and under loom, which runs its models in every
  # interleaving of the two sides and every order the memory model allows their writes to be
  # seen in.
  ring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo miri test -p ring --locked
      - run: cargo test -p ring --test loom --release --locked
        env:
          RUSTFLAGS: --cfg loom
          CARGO_TARGET_DIR: target/loom

  # The mirror of a real market, a workspace of its own: its formatting, lints and tests,
  # one of them against a real exchange. None reaches the venue.
  mirror:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mirror
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The public demo's image builds, and its compose file is valid (deploy/README.md).
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh deploy/make-accounts.sh
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          DOMAIN: demo.example.com
      - run: docker build -f deploy/Dockerfile -t exchange-demo .
      - name: The image's programs run, and answer with their usage
        run: |
          for program in gateway bots mirror; do
            out=$(docker run --rm --entrypoint "$program" exchange-demo --help 2>&1 || true)
            echo "$out" | grep -q usage
          done

  # The minimum supported Rust version declared in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ccee93717622f2100ea90b0833cbd1575c4c56b2 # 1.85
        with:
          toolchain: 1.85
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked

  # Line and branch coverage of the book and the engine by the whole test suite. Branch
  # coverage needs nightly. `src/workload.rs` is the benchmarks' order-flow generator and
  # `engine-soak` the kill test's child process, not engine code.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Run the tests with coverage instrumentation
        run: >
          cargo llvm-cov --workspace --locked --branch
          --ignore-filename-regex '(workload|engine-soak)\.rs'
          --lcov --output-path lcov.info
      - name: Report line and branch coverage
        run: |
          cargo llvm-cov report --branch --ignore-filename-regex '(workload|engine-soak)\.rs' \
            --summary-only | tee coverage.txt
          { echo '### Coverage of the book and the engine'; echo '```'; cat coverage.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info

  # Each fuzz target runs for 30 seconds, starting from the corpus earlier runs left in the
  # cache plus a few long random inputs, so every push adds to the fuzzing done so far.
  # The library forbids `unsafe`, so the targets run without a sanitizer; debug assertions
  # and overflow checks stay on. The prebuilt cargo-fuzz is a static musl binary, which
  # would otherwise build for musl.
  fuzz:
    runs-on: ubuntu-latest
    env:
      FUZZ_FLAGS: --sanitizer none --debug-assertions --target x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-fuzz@0.13.2
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target for 30 seconds
        run: |
          for target in $(cargo fuzz list); do
            mkdir -p "fuzz/corpus/$target"
            for i in 1 2 3 4; do head -c 4096 /dev/urandom > "fuzz/corpus/$target/random-$i"; done
            cargo fuzz run "$target" $FUZZ_FLAGS -- \
              -max_total_time=30 -len_control=0 -max_len=4096
            rm -f "fuzz/corpus/$target"/random-*
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Bounded proofs of the bitset's helpers, the order pool and the owner lists, one job
  # per group of harnesses, so they run in parallel and each reports on its own. Each
  # takes under a minute; the bitset search proofs take up to half an hour or more each
  # and run in the scheduled workflow. Kani does not run on Windows.
  kani:
    name: kani (${{ matrix.proofs }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - proofs: bit helpers
            harnesses: >-
              --harness low_bits_through --harness highest_bit
              --harness dense_sets_with_no_levels
          - proofs: order pool
            harnesses: --harness pool::proofs
          - proofs: owner lists
            harnesses: --harness owners::proofs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: '0.68.0'
          working-directory: crates/orderbook
          args: --output-format=terse ${{ matrix.harnesses }}
