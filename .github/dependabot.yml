# Proposes updates to the commits the workflows' actions are pinned to.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Only releases two weeks old or more: a compromised one is usually caught by then.
    cooldown:
      default-days: 14
    ignore:
      # Its branches are toolchains, not versions: each pin names the one it installs,
      # and an update would point them all at the stable branch.
      - dependency-name: dtolnay/rust-toolchain
